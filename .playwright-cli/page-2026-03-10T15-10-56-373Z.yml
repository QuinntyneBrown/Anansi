                - paragraph [ref=e764]
                - paragraph [ref=e765]:
                  - strong [ref=e766]: "REQUIREMENT:"
                - paragraph [ref=e767]:
                  - emphasis [ref=e768]: Work Scope-
                - paragraph [ref=e769]: Reporting to the Enterprise Architect, the Solutions Architect APM is responsible for supporting the Application Portfolio Modernization ("APM”) Program in the IT Solutions division of the Corporate Services department. The APM Program is a risk and compliance initiative designed to proactively measure and manage Peel's technology application portfolio and effectively reduce the risks of security and technical failure. The Solutions Architect will ensure that the agency can continually optimize the effectiveness of technology applications through the implementation of industry standard measurement and analysis frameworks. The application portfolio is comprised of mission critical applications running on a combination of traditional on-premises; cloud-based; and smaller standalone Microsoft Windows environments, in varying stages of their lifecycles. The Solutions Architect will be responsible for analyzing, planning, and executing a program with complex considerations and integration points. This is an exciting opportunity to transform the technological landscape of an organization
                - paragraph [ref=e770]
                - paragraph [ref=e771]:
                  - strong [ref=e772]:
                    - emphasis [ref=e773]: "Deliverables:"
                - list [ref=e774]:
                  - listitem [ref=e775]: Collaboratively defines and regularly updates and maintains meaningful metrics that reflect the condition level of software applications, i.e., their technical and functional state of good repair, and alignment with Peel's digital strategy and target state architecture.
                  - listitem [ref=e776]: Recommends specific upgrade, maintain, replacement, or retirement actions to ensure that all applications stay above the desired condition level, and control and measurably reduce the application portfolio's overall technical debt.
                  - listitem [ref=e777]: "Actively collaborates with IT Solutions leadership and relevant Corporate Services and client stakeholders to:"
                  - listitem [ref=e778]: Provide technology roadmaps and strategic planning in support of evolving Client program goals and objectives.
                  - listitem [ref=e779]: Provide application assessment work and recommendations for effective short- and medium-term Application Portfolio upgrade and replacement projects, including recommended phased approaches to align with more complex long-term technology transitions.
                  - listitem [ref=e780]: Creates solution design documents and collaboratively provides direction and oversight for effective and secure solutions, ensuring robust interoperability with other relevant regional systems, and conformance to the Corporate Services quality assurance, IT security and enterprise architecture principles, and to the Peel Digital Strategy.
                  - listitem [ref=e781]: Reviews related requirements and configuration documents received from approved third parties, to ensure compliance with IT security and infrastructure policies, standards, and procedures.
                  - listitem [ref=e782]: Analyzes, designs, and monitors technologies that support existing line of business capabilities.
                  - listitem [ref=e783]: Develops, updates, and maintains the architecture blueprint that will include as-is architecture, target architecture, and architecture evolution roadmap (1-5 years) aligned with planned projects.
                  - listitem [ref=e784]: Updates and maintains an accessible repository for reference models and project-related architectural and application development materials related to Client.
                  - listitem [ref=e785]: Reviews all design documents for new or upgraded application and integration projects to ensure compliance with architectural policies, standards, and procedures, and AODA compliant.
                  - listitem [ref=e786]: Develops logical data models, data accountability, logical database tables and maps logical data models to databases.
                - paragraph [ref=e787]
                - paragraph [ref=e788]:
                  - strong [ref=e789]:
                    - emphasis [ref=e790]: "Qualifications and Experience:"
                - list [ref=e791]:
                  - listitem [ref=e792]: University or college graduate in Computer Science with a post-bachelor's certificate/diploma in Application Development or related disciplines.
                  - listitem [ref=e793]: A minimum of 5 years advanced development experience with ITIL, COBIT, application development, spatial database modeling & design, and information architecture.
                  - listitem [ref=e794]: Proven experience in architecting, designing, and implementing high performance and scalable enterprise level systems and the ability to evaluate how the solution will best meet its functional and quality requirements.
                  - listitem [ref=e795]: Experience in application portfolio rationalization and optimization initiatives preferred.
                  - listitem [ref=e796]: Proven experience with object-oriented analysis, design, and programming, unified modeling language, model driven architecture, design patterns, service-oriented architecture, and business plan modeling.
                  - listitem [ref=e797]: "Expert knowledge and proficiency with the following:"
                  - listitem [ref=e798]: IT Infrastructure Library,
                  - listitem [ref=e799]: Control Objectives for Information Technologies,
                  - listitem [ref=e800]: Integration techniques and Service Oriented Architectures
                  - listitem [ref=e801]: Technology asset life cycle including performance management, preventive maintenance, and security.
                  - listitem [ref=e802]: Experience in application development and programming using Java, C#, or .NET.
                  - listitem [ref=e803]: Experience with industry-standard technologies such as Java, XML, JSON, JSON, JavaScript, HTML5, Web services, SOAP/REST, application servers, and/or Web servers.
                  - listitem [ref=e804]: Experience with SQL and Enterprise Asset Management databases (DB2, Oracle and SQL Server).
                  - listitem [ref=e805]: Highly developed writing skills to author complex specification documents, blueprints, and proposals.
                  - listitem [ref=e806]: Progressive technical knowledge and knowledge of best practices in Information Technology service delivery such as SDLC, PMBOK, COBIT and ITIL.
